<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a42">
<title>لوحة المعلم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap">
<style>
:root{--bg:#e9eee9;--pa:#fbfcfa;--ink:#10231f;--mu:#5c6f69;--pr:#0f5e54;--on:#fff;--hd:#0b4a42;--go:#e0a526;--er:#b3402e;--bd:#cfd9d3;--ok:#1e7a4a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1412;--pa:#16201d;--ink:#e8f0ec;--mu:#92a69f;--pr:#4fd1b8;--on:#07201b;--hd:#14302a;--go:#f0b93b;--er:#ff8a73;--bd:#2a3a35;--ok:#4fd18a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Readex Pro",system-ui,sans-serif}
button,input,textarea,select{font:inherit}
.top{background:var(--hd);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 70px;display:flex;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:1.3rem}.top small{opacity:.75}
.logout{background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.85rem}
main{max-width:720px;margin:-52px auto 0;padding:0 14px 110px}
.stats{display:flex;background:var(--pa);border-radius:18px;box-shadow:0 10px 28px #0b4a4230;margin-bottom:14px}
.stats div{flex:1;padding:14px 8px;text-align:center;color:var(--mu);font-size:.8rem}.stats div+div{border-inline-start:1px solid var(--bd)}
.stats b{display:block;font-size:1.7rem;color:var(--pr);line-height:1.2}
.stats b.warn{color:var(--go)}
.seg{display:flex;background:var(--pa);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;min-width:80px;border:0;background:none;color:var(--mu);padding:9px;border-radius:9px;font-weight:600;cursor:pointer;white-space:nowrap;position:relative}
.seg .a{background:var(--pr);color:var(--on)}
.seg .badge{position:absolute;top:2px;inset-inline-end:4px;background:var(--er);color:#fff;font-size:.65rem;font-weight:700;padding:0 6px;border-radius:10px;min-width:16px}
.rc{position:relative;background:var(--pa);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 0 var(--bd)}
.rc h3{margin:0;font-size:1.02rem;padding-inline-end:80px}.rc p{margin:2px 0 0;color:var(--mu);font-size:.88rem}
.cut{border-top:2px dashed var(--bd);margin:12px -14px;position:relative}
.cut::before,.cut::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.cut::before{inset-inline-start:-9px}.cut::after{inset-inline-end:-9px}
.ft{display:flex;justify-content:space-between;font-size:.84rem;color:var(--mu);flex-wrap:wrap;gap:4px}
.st{position:absolute;inset-inline-end:14px;top:12px;transform:rotate(-7deg);border:2px solid var(--pr);color:var(--pr);padding:1px 9px;border-radius:7px;font-weight:700;font-size:.78rem}.st.cl{border-color:var(--er);color:var(--er)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.acts button{flex:1;min-width:70px;padding:8px 4px;border-radius:10px;border:1px solid var(--bd);background:none;color:var(--ink);cursor:pointer;font-size:.85rem}
.acts .p{background:var(--pr);color:var(--on);border-color:var(--pr)}.acts .d{color:var(--er);flex:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}.chip{flex:none;border:1px solid var(--bd);background:var(--pa);color:var(--mu);padding:6px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}.chip.a{border-color:var(--pr);color:var(--pr);font-weight:700}
.sr{background:var(--pa);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 0 var(--bd)}.sr .h{display:flex;gap:12px;align-items:center}
.ava{flex:none;width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.sr .h>div:nth-child(2){flex:1;min-width:0}.mu{color:var(--mu);font-size:.85rem}
.tg{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 9px;border-radius:20px;border:1px solid var(--go);color:var(--go);margin-inline-start:6px}.tg.r{border-color:var(--er);color:var(--er)}
.badge-status{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:20px;margin-inline-start:6px;border:1px solid}
.badge-status.pending{border-color:var(--go);color:var(--go)}
.badge-status.accepted{border-color:var(--ok);color:var(--ok)}
.badge-status.rejected{border-color:var(--er);color:var(--er)}
.fl{margin-top:8px;padding:8px 12px;background:var(--bg);border-radius:10px;font-size:.88rem}
.tnote{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:.88rem;border-inline-start:3px solid var(--pr);background:color-mix(in srgb,var(--pr) 8%,transparent)}
.sacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sacts button{flex:1;min-width:80px;padding:7px 6px;border-radius:9px;border:1px solid var(--bd);background:none;color:var(--ink);cursor:pointer;font-size:.82rem;font-weight:600}
.sacts .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.sacts .rj{background:var(--er);color:#fff;border-color:var(--er)}
.sacts .rv{border-color:var(--pr);color:var(--pr)}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--go);color:#10231f;font-size:2rem;box-shadow:0 8px 20px #0005;cursor:pointer;z-index:4}
.ov{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;inset-inline:0;bottom:0;max-width:560px;margin:auto;background:var(--pa);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto;z-index:6}.sh.on{transform:none}
.grip{width:40px;height:4px;background:var(--bd);border-radius:4px;margin:0 auto 14px}.sh h2{margin:0 0 6px;font-size:1.2rem}
.sh label{display:block;margin-top:12px;font-size:.85rem;color:var(--mu)}
.sh input,.sh textarea,.sh select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);margin-top:4px;resize:none}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--pr);color:var(--on);font-weight:700;margin-top:16px;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.rj{background:var(--er)}
.em{text-align:center;color:var(--mu);padding:40px 10px}
.ts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:30px;transform:translateY(-250%);transition:transform .3s;z-index:9}.ts.on{transform:none}
.cls-card{background:var(--pa);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 var(--bd);display:flex;justify-content:space-between;gap:10px;align-items:center}
.cls-card .info{flex:1;min-width:0}.cls-card h3{margin:0;font-size:1rem}.cls-card .code{font-family:monospace;background:var(--bg);padding:2px 8px;border-radius:6px;font-weight:700;color:var(--pr);letter-spacing:1px}
.cls-card .acts-inline{display:flex;gap:6px}.cls-card .acts-inline button{border:1px solid var(--bd);background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.82rem;color:var(--ink)}.cls-card .acts-inline .d{color:var(--er);border-color:var(--er)}
.stu-card{background:var(--pa);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 var(--bd)}
.stu-card .info{flex:1;min-width:0}.stu-card .stat-row{display:flex;gap:10px;font-size:.78rem;margin-top:4px;flex-wrap:wrap}
.stu-card .stat-row span{padding:1px 8px;border-radius:10px;background:var(--bg)}
.stu-card .stat-row .ok{color:var(--ok)}.stu-card .stat-row .warn{color:var(--go)}.stu-card .stat-row .bad{color:var(--er)}
.empty-cls{padding:16px;text-align:center;background:var(--pa);border-radius:14px;border:2px dashed var(--bd);color:var(--mu);margin-bottom:14px;cursor:pointer}
.file-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--pa);border:1px solid var(--bd);border-radius:10px;font-size:.85rem}
.file-item .ic{flex:none;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff}
.file-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.file-item .sz{color:var(--mu);font-size:.75rem;flex:none}
.file-item .dl{flex:none;background:var(--pr);color:var(--on);border:0;padding:5px 10px;border-radius:7px;font-size:.75rem;font-weight:600;cursor:pointer}
.search-wrap{margin-bottom:14px}
.search-wrap input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--pa);color:var(--ink)}
.loading{text-align:center;padding:40px;color:var(--mu)}
</style></head><body>
<div class="top">
  <div><small>لوحة المعلم</small><h1 id="topName">جاري التحميل...</h1></div>
  <button class="logout" id="logout">خروج</button>
</div>
<main id="app"><div class="loading">⏳ جاري التحميل...</div></main>
<button class="fab" id="fab" style="display:none">+</button>
<div class="ov" id="ov"></div><section class="sh" id="sh"></section><div class="ts" id="ts"></div>

<script src="supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
let me=null,tab='tasks',sel=null,fltStatus='all',fltClass=null,search='';
let classes=[],tasks=[],subs=[],students=[];

function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function closeSh(){$('#sh').classList.remove('on');$('#ov').classList.remove('on')}
$('#ov').onclick=closeSh;

const clsMap=()=>{const m={};classes.forEach(c=>m[c.id]=c);return m};
const perTask=()=>{const by={};subs.forEach(s=>{(by[s.task_id]=by[s.task_id]||{})[s.student_id]=(by[s.task_id]?.[s.student_id]||[]).concat([s])});return by};
const latestOf=(list)=>[...list].sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at))[0];
const studentName=id=>students.find(s=>s.id===id)?.full_name||'طالب';

async function loadAll(){
  [classes,tasks,subs,students]=await Promise.all([
    api.getClasses(), api.getTasks(), api.getSubmissionsForTeacher(), api.getStudentsInMyClasses()
  ]);
}

function formTask(t){
  const classOpts=classes.map(c=>`<option value="${c.id}" ${t&&t.class_id===c.id?'selected':''}>${esc(c.name)} (${c.code})</option>`).join('');
  const dl = t ? new Date(t.deadline) : null;
  const dlVal = dl ? new Date(dl.getTime()-dl.getTimezoneOffset()*6e4).toISOString().slice(0,16) : '';
  $('#sh').innerHTML=`<div class="grip"></div><h2>${t?'تعديل المهمة':'مهمة جديدة'}</h2>
  <label>الشعبة<select id="cs"><option value="">— اختر —</option>${classOpts}</select></label>
  <label>العنوان<input id="ti" value="${esc(t?.title)}"></label>
  <label>الوصف<textarea id="de" rows="4">${esc(t?.description)}</textarea></label>
  <label>آخر موعد<input id="dl" type="datetime-local" value="${dlVal}"></label>
  <button class="btn" id="sv">${t?'حفظ':'نشر'}</button>`;
  $('#sh').classList.add('on');$('#ov').classList.add('on');
  $('#sv').onclick=async()=>{
    const cs=$('#cs').value,ti=$('#ti').value.trim(),dl=$('#dl').value;
    if(!cs)return toast('اختر الشعبة');
    if(!ti||!dl)return toast('العنوان والموعد مطلوبين');
    try{
      $('#sv').disabled=true;$('#sv').textContent='جاري الحفظ...';
      await api.saveTask({id:t?.id,classId:cs,title:ti,desc:$('#de').value.trim(),deadline:new Date(dl).toISOString(),closed:t?.closed||false});
      closeSh();toast(t?'تم الحفظ':'تم النشر');await refresh();
    }catch(e){toast('خطأ: '+e.message);$('#sv').disabled=false}
  };
}

function formClass(c){
  const code=c?.code||(()=>{const cs='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=cs[Math.floor(Math.random()*cs.length)];return s})();
  $('#sh').innerHTML=`<div class="grip"></div><h2>${c?'تعديل الشعبة':'شعبة جديدة'}</h2>
  <label>اسم الشعبة<input id="nm" value="${esc(c?.name)}" placeholder="مثلاً: إدارة أعمال أ"></label>
  <label>كود الدخول<input id="cd" value="${esc(code)}" style="font-family:monospace;letter-spacing:2px;text-transform:uppercase"></label>
  <button class="btn" id="sv">${c?'حفظ':'إنشاء'}</button>`;
  $('#sh').classList.add('on');$('#ov').classList.add('on');
  $('#sv').onclick=async()=>{
    const nm=$('#nm').value.trim(),cd=$('#cd').value.trim().toUpperCase();
    if(!nm||!cd)return toast('الاسم والكود مطلوبين');
    if(cd.length<4)return toast('الكود 4 أحرف على الأقل');
    try{
      if(await api.classCodeExists(cd,c?.id))return toast('الكود مستخدم');
      $('#sv').disabled=true;
      await api.saveClass({id:c?.id,name:nm,code:cd});
      closeSh();toast(c?'تم الحفظ':'تم الإنشاء');await refresh();
    }catch(e){toast('خطأ: '+e.message);$('#sv').disabled=false}
  };
}

function reviewSheet(sub){
  $('#sh').innerHTML=`<div class="grip"></div><h2>مراجعة التسليم</h2>
  <p class="mu">الطالب: <b>${esc(studentName(sub.student_id))}</b></p>
  <div class="mu">الحالة: <span class="badge-status ${stClass(sub.status)}">${stLabel(sub.status)}</span></div>
  <label>ملاحظة للطالب<textarea id="tn" rows="3">${esc(sub.teacher_note||'')}</textarea></label>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn ok" id="bOk" style="margin-top:0">قبول ✓</button>
    <button class="btn rj" id="bRj" style="margin-top:0">رفض ✗</button>
  </div>
  <button class="btn" id="bPend" style="background:transparent;color:var(--pr);border:1px solid var(--pr)">إعادة لبانتظار</button>`;
  $('#sh').classList.add('on');$('#ov').classList.add('on');
  const note=()=>$('#tn').value.trim();
  const doSet=async(st,lbl)=>{await api.updateSubmissionStatus(sub.id,st,note());closeSh();toast(lbl);await refresh()};
  $('#bOk').onclick=()=>doSet('accepted','مقبول');
  $('#bRj').onclick=()=>{if(!note())return toast('اكتب ملاحظة للرفض');doSet('rejected','مرفوض')};
  $('#bPend').onclick=()=>doSet('pending','بانتظار المراجعة');
}

function filesHTML(files){
  if(!files||!files.length)return '<div class="mu">بدون ملفات</div>';
  return `<div class="file-list">${files.map(f=>{
    const ic=fileIcon(f.file_type,f.file_name);
    return `<div class="file-item">
      <div class="ic" style="background:${ic.color}">${ic.label}</div>
      <div class="nm">${esc(f.file_name)}</div>
      <div class="sz">${humanSize(f.file_size)}</div>
      <button class="dl" data-path="${esc(f.file_path)}" data-name="${esc(f.file_name)}">تحميل</button>
    </div>`;
  }).join('')}</div>`;
}

async function render(){
  if(!me) return;
  $('#topName').textContent='أهلاً '+me.full_name;
  $('#fab').style.display='';
  const cm=clsMap(),pt=perTask();

  let totalPending=0;
  Object.values(pt).forEach(byStudent=>Object.values(byStudent).forEach(list=>{
    if((latestOf(list).status||'pending')==='pending')totalPending++;
  }));

  let h=`<div class="stats">
    <div><b>${tasks.filter(isOpen).length}</b>مهام مفتوحة</div>
    <div><b>${subs.length}</b>تسليمات</div>
    <div><b class="${totalPending?'warn':''}">${totalPending}</b>بانتظار</div>
    <div><b>${classes.length}</b>شعب</div>
  </div>
  <div class="seg">
    <button data-t="tasks" class="${tab==='tasks'?'a':''}">المهام</button>
    <button data-t="subs" class="${tab==='subs'?'a':''}">التسليمات${totalPending?`<span class="badge">${totalPending}</span>`:''}</button>
    <button data-t="classes" class="${tab==='classes'?'a':''}">الشعب (${classes.length})</button>
    <button data-t="students" class="${tab==='students'?'a':''}">الطلاب (${students.length})</button>
  </div>
  <div class="search-wrap"><input id="q" placeholder="🔎 بحث..." value="${esc(search)}"></div>`;

  if(tab==='tasks'){
    if(!classes.length){h+='<div class="empty-cls" id="goCls">➕ ما في شعب — اضغط لإنشاء أول شعبة</div>'}
    else if(!tasks.length){h+='<div class="em">ابدأ بنشر أول مهمة من +</div>'}
    else{
      let shown=fltClass?tasks.filter(t=>t.class_id===fltClass):tasks;
      if(search)shown=shown.filter(t=>t.title.toLowerCase().includes(search.toLowerCase()));
      if(classes.length>1)h+=`<div class="chips"><button class="chip ${!fltClass?'a':''}" data-fc="">الكل</button>${classes.map(c=>`<button class="chip ${fltClass===c.id?'a':''}" data-fc="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
      h+=shown.map(t=>{
        const by=pt[t.id]||{},n=Object.keys(by).length,pending=Object.values(by).filter(l=>latestOf(l).status==='pending').length;
        const cls=cm[t.class_id],o=isOpen(t);
        return `<div class="rc"><span class="st ${o?'':'cl'}">${o?'مفتوحة':'مغلقة'}</span>
        <h3>${esc(t.title)}</h3><p>${esc(t.description)}</p>
        <div class="mu" style="margin-top:4px">📚 ${cls?esc(cls.name):'—'}</div>
        <div class="cut"></div>
        <div class="ft"><span>${fmt(t.deadline)}</span><span><b>${n}</b> سلّم${pending?` · <b style="color:var(--go)">${pending} بانتظار</b>`:''}</span></div>
        <div class="acts"><button class="p" data-v="${t.id}">التسليمات</button><button data-e="${t.id}">تعديل</button><button data-x="${t.id}">${o?'إغلاق':'فتح'}</button><button class="d" data-r="${t.id}">حذف</button></div></div>`;
      }).join('');
    }
  }
  else if(tab==='subs'){
    const filteredTasks=fltClass?tasks.filter(t=>t.class_id===fltClass):tasks;
    const t=filteredTasks.find(x=>x.id===sel)||filteredTasks[0];
    if(!t)h+='<div class="em">ما في مهام</div>';
    else{
      sel=t.id;
      let ents=Object.entries(pt[t.id]||{});
      ents=ents.filter(([,l])=>{if(fltStatus==='all')return true;return latestOf(l).status===fltStatus});
      if(search)ents=ents.filter(([sid])=>studentName(sid).toLowerCase().includes(search.toLowerCase()));
      ents.sort((a,b)=>new Date(latestOf(b[1]).submitted_at)-new Date(latestOf(a[1]).submitted_at));
      if(classes.length>1)h+=`<div class="chips"><button class="chip ${!fltClass?'a':''}" data-fc="">كل الشعب</button>${classes.map(c=>`<button class="chip ${fltClass===c.id?'a':''}" data-fc="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
      h+=`<div class="chips">${filteredTasks.map(x=>`<button class="chip ${x.id===t.id?'a':''}" data-s="${x.id}">${esc(x.title)}</button>`).join('')}</div>`;
      const counts={all:0,pending:0,accepted:0,rejected:0};
      Object.values(pt[t.id]||{}).forEach(l=>{counts.all++;const st=latestOf(l).status||'pending';counts[st]=(counts[st]||0)+1});
      h+=`<div class="chips" style="margin-bottom:14px">
        <button class="chip ${fltStatus==='all'?'a':''}" data-fs="all">الكل (${counts.all})</button>
        <button class="chip ${fltStatus==='pending'?'a':''}" data-fs="pending">بانتظار (${counts.pending})</button>
        <button class="chip ${fltStatus==='accepted'?'a':''}" data-fs="accepted">مقبول (${counts.accepted})</button>
        <button class="chip ${fltStatus==='rejected'?'a':''}" data-fs="rejected">مرفوض (${counts.rejected})</button>
      </div>`;
      h+=ents.map(([sid,list])=>{
        const latest=latestOf(list),older=list.filter(x=>x.id!==latest.id);
        const st=latest.status||'pending',late=new Date(latest.submitted_at)>new Date(t.deadline);
        return `<div class="sr">
          <div class="h"><div class="ava" style="background:${col(studentName(sid))}">${esc(studentName(sid)[0])}</div>
          <div><b>${esc(studentName(sid))}</b>
            <span class="badge-status ${stClass(st)}">${stLabel(st)}</span>
            ${list.length>1?`<span class="tg">${list.length} نسخ</span>`:''}
            ${late?'<span class="tg r">متأخر</span>':''}
            <div class="mu">${fmt(latest.submitted_at)}</div></div></div>
          <div class="fl">${filesHTML(latest.submission_files)}${latest.note?`<div class="mu" style="margin-top:6px">📝 ${esc(latest.note)}</div>`:''}</div>
          ${latest.teacher_note?`<div class="tnote">📝 ${esc(latest.teacher_note)}</div>`:''}
          <div class="sacts">
            ${st!=='accepted'?`<button class="ok" data-ok="${latest.id}">قبول</button>`:''}
            ${st!=='rejected'?`<button class="rj" data-rj="${latest.id}">رفض</button>`:''}
            <button class="rv" data-rv="${latest.id}">مراجعة</button>
          </div>
        </div>`;
      }).join('')||'<div class="em">ما في تسليمات</div>';
    }
  }
  else if(tab==='classes'){
    if(!classes.length)h+='<div class="em">ما في شعب</div>';
    else h+=classes.map(c=>{
      const ts=tasks.filter(t=>t.class_id===c.id).length;
      const cs=students.filter(s=>s.class_id===c.id).length;
      return `<div class="cls-card"><div class="info"><h3>${esc(c.name)}</h3>
        <div class="mu">كود: <span class="code">${c.code}</span> · ${ts} مهمة · ${cs} طالب</div></div>
        <div class="acts-inline"><button data-ce="${c.id}">تعديل</button><button class="d" data-cd="${c.id}">حذف</button></div></div>`;
    }).join('');
  }
  else if(tab==='students'){
    let list=fltClass?students.filter(s=>s.class_id===fltClass):students;
    if(search)list=list.filter(s=>s.full_name.toLowerCase().includes(search.toLowerCase()));
    if(classes.length>1)h+=`<div class="chips"><button class="chip ${!fltClass?'a':''}" data-fc="">كل الشعب</button>${classes.map(c=>`<button class="chip ${fltClass===c.id?'a':''}" data-fc="${c.id}">${esc(c.name)}</button>`).join('')}</div>`;
    if(!list.length)h+='<div class="em">ما في طلاب</div>';
    else h+=list.map(s=>{
      const my=subs.filter(x=>x.student_id===s.id);
      const byTask={};my.forEach(x=>{if(!byTask[x.task_id]||new Date(x.submitted_at)>new Date(byTask[x.task_id].submitted_at))byTask[x.task_id]=x});
      const acc=Object.values(byTask).filter(x=>x.status==='accepted').length;
      const pend=Object.values(byTask).filter(x=>(x.status||'pending')==='pending').length;
      const rej=Object.values(byTask).filter(x=>x.status==='rejected').length;
      return `<div class="stu-card"><div class="ava" style="background:${col(s.full_name)}">${esc(s.full_name[0])}</div>
        <div class="info"><b>${esc(s.full_name)}</b>
        <div class="mu">📚 ${cm[s.class_id]?esc(cm[s.class_id].name):'—'} · ${Object.keys(byTask).length} تسليم</div>
        <div class="stat-row">${acc?`<span class="ok">✓ ${acc}</span>`:''}${pend?`<span class="warn">⏳ ${pend}</span>`:''}${rej?`<span class="bad">✗ ${rej}</span>`:''}</div></div></div>`;
    }).join('');
  }

  $('#app').innerHTML=h;

  const q=$('#q');if(q)q.oninput=()=>{search=q.value.trim();render();q.focus()};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;fltStatus='all';search='';render()});
  document.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{fltClass=b.dataset.fc||null;sel=null;render()});
  document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{fltStatus=b.dataset.fs;render()});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sel=b.dataset.s;fltStatus='all';render()});
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{sel=b.dataset.v;tab='subs';fltStatus='all';fltClass=null;render();scrollTo(0,0)});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>formTask(tasks.find(x=>x.id===b.dataset.e)));
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const t=tasks.find(x=>x.id===b.dataset.x);try{await api.saveTask({...t,desc:t.description,classId:t.class_id,closed:!t.closed});await refresh()}catch(e){toast('خطأ: '+e.message)}});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف المهمة؟'))return;try{await api.deleteTask(b.dataset.r);toast('تم الحذف');await refresh()}catch(e){toast('خطأ: '+e.message)}});
  document.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>formClass(classes.find(c=>c.id===b.dataset.ce)));
  document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف الشعبة؟'))return;try{await api.deleteClass(b.dataset.cd);toast('تم الحذف');await refresh()}catch(e){toast('خطأ: '+e.message)}});
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{try{await api.updateSubmissionStatus(b.dataset.ok,'accepted','');toast('تم القبول');await refresh()}catch(e){toast('خطأ')}});
  document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{const sub=subs.find(x=>x.id===b.dataset.rj);reviewSheet(sub)});
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{const sub=subs.find(x=>x.id===b.dataset.rv);reviewSheet(sub)});
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{
    try{const url=await api.getFileUrl(b.dataset.path);const a=document.createElement('a');a.href=url;a.download=b.dataset.name;document.body.appendChild(a);a.click();a.remove()}
    catch(e){toast('خطأ في التحميل')}
  });
  const gc=document.getElementById('goCls');if(gc)gc.onclick=()=>formClass();
}

async function refresh(){await loadAll();render()}

$('#fab').onclick=()=>{if(!classes.length){toast('أنشئ شعبة أولاً');tab='classes';render();return}formTask()};
$('#logout').onclick=async()=>{await api.signOut();location.href='auth.html'};

(async()=>{
  me = await api.requireAuth('teacher');
  if(!me)return;
  await refresh();
})();
</script></body></html>
