<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a42">
<title>دخول — إدارة الأعمال</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap">
<style>
:root{--bg:#e9eee9;--pa:#fbfcfa;--ink:#10231f;--mu:#5c6f69;--pr:#0f5e54;--on:#fff;--hd:#0b4a42;--go:#e0a526;--er:#b3402e;--bd:#cfd9d3;--ok:#1e7a4a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1412;--pa:#16201d;--ink:#e8f0ec;--mu:#92a69f;--pr:#4fd1b8;--on:#07201b;--hd:#14302a;--go:#f0b93b;--er:#ff8a73;--bd:#2a3a35;--ok:#4fd18a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--hd);color:var(--ink);font:400 15px/1.6 "Readex Pro",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--pa);border-radius:22px;padding:26px;width:100%;max-width:400px}
h1{margin:0 0 4px;font-size:1.5rem}
.mu{color:var(--mu);font-size:.88rem}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:16px 0}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:9px;font-weight:600;cursor:pointer}
.seg .a{background:var(--pr);color:var(--on)}
label{display:block;margin-top:12px;font-size:.85rem;color:var(--mu)}
input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);margin-top:4px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--pr);color:var(--on);font-weight:700;margin-top:18px;cursor:pointer;font-size:1rem}
.btn:disabled{opacity:.5}
.err{color:var(--er);font-size:.85rem;margin-top:10px;min-height:1.2em}
.info{background:color-mix(in srgb,var(--pr) 8%,transparent);border-inline-start:3px solid var(--pr);padding:10px 12px;border-radius:10px;font-size:.83rem;margin-top:14px}
</style></head><body>
<div class="card">
  <h1 id="title">أهلاً فيك 👋</h1>
  <div class="mu" id="subtitle">سجّل دخولك للمتابعة</div>

  <div class="seg" id="modeSeg">
    <button data-m="login" class="a">دخول</button>
    <button data-m="signup">حساب جديد</button>
  </div>

  <div id="signupFields" style="display:none">
    <label>الاسم الكامل<input id="fullName" placeholder="مثلاً: أحمد محمد"></label>
    <label>نوع الحساب<select id="role">
      <option value="student">طالب</option>
      <option value="teacher">معلم</option>
    </select></label>
    <label id="classCodeWrap">كود الشعبة (من المعلم)<input id="classCode" placeholder="ABC123" style="font-family:monospace;letter-spacing:2px;text-transform:uppercase"></label>
  </div>

  <label>البريد الإلكتروني<input id="email" type="email" placeholder="you@example.com" dir="ltr"></label>
  <label>كلمة السر<input id="password" type="password" placeholder="6 أحرف على الأقل" dir="ltr"></label>

  <div class="err" id="err"></div>
  <button class="btn" id="go">دخول</button>

  <div class="info" id="info" style="display:none"></div>
</div>

<script src="supabase.js"></script>
<script>
let mode='login';
const $=s=>document.querySelector(s);

(async()=>{
  try{
    const p = await api.getProfile();
    if(p){ location.href = p.role==='teacher' ? 'admin.html' : 'student.html'; }
  }catch(e){}
})();

document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;
  document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('a',x.dataset.m===mode));
  $('#signupFields').style.display = mode==='signup' ? '' : 'none';
  $('#title').textContent = mode==='signup' ? 'حساب جديد' : 'أهلاً فيك 👋';
  $('#subtitle').textContent = mode==='signup' ? 'أنشئ حسابك' : 'سجّل دخولك';
  $('#go').textContent = mode==='signup' ? 'إنشاء الحساب' : 'دخول';
  $('#err').textContent='';$('#info').style.display='none';
});

$('#role').onchange=()=>{
  $('#classCodeWrap').style.display = $('#role').value==='student' ? '' : 'none';
};

$('#go').onclick=async()=>{
  const email=$('#email').value.trim(),password=$('#password').value;
  const err=$('#err');err.textContent='';
  if(!email||!password){err.textContent='البريد وكلمة السر مطلوبين';return}
  if(password.length<6){err.textContent='كلمة السر 6 أحرف على الأقل';return}
  $('#go').disabled=true;
  try{
    if(mode==='login'){
      await api.signIn({email,password});
      const p = await api.getProfile();
      location.href = p.role==='teacher' ? 'admin.html' : 'student.html';
    } else {
      const fullName=$('#fullName').value.trim();
      const role=$('#role').value;
      const classCode=role==='student'?$('#classCode').value.trim().toUpperCase():null;
      if(!fullName){err.textContent='الاسم مطلوب';$('#go').disabled=false;return}
      if(role==='student'&&!classCode){err.textContent='كود الشعبة مطلوب';$('#go').disabled=false;return}
      await api.signUp({email,password,fullName,role,classCode});
      $('#info').style.display='';
      $('#info').innerHTML='✅ تم إنشاء الحساب. جاري تحويلك...';
      setTimeout(async()=>{
        await api.signIn({email,password});
        const p = await api.getProfile();
        location.href = p.role==='teacher' ? 'admin.html' : 'student.html';
      }, 1000);
    }
  }catch(e){
    err.textContent = e.message || 'حدث خطأ';
  }finally{
    $('#go').disabled=false;
  }
};
</script></body></html>
