<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a42">
<title>مهامي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap">
<style>
:root{--bg:#e9eee9;--pa:#fbfcfa;--ink:#10231f;--mu:#5c6f69;--pr:#0f5e54;--on:#fff;--hd:#0b4a42;--go:#e0a526;--er:#b3402e;--bd:#cfd9d3;--ok:#1e7a4a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1412;--pa:#16201d;--ink:#e8f0ec;--mu:#92a69f;--pr:#4fd1b8;--on:#07201b;--hd:#14302a;--go:#f0b93b;--er:#ff8a73;--bd:#2a3a35;--ok:#4fd18a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Readex Pro",system-ui,sans-serif}
button{font:inherit}
.top{background:var(--hd);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 64px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top>div:first-child{flex:1;min-width:0}
.top small{opacity:.75;font-size:.8rem}.top h1{margin:0;font-size:1.3rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--go);background:none;color:#fff;font-weight:700;cursor:pointer;flex:none}
main{max-width:560px;margin:-46px auto 0;padding:0 14px 48px}
.hero{background:var(--pa);border-radius:18px;padding:16px 18px;box-shadow:0 10px 28px #0b4a4230;margin-bottom:14px}
.hero .n{font-size:2rem;font-weight:700;color:var(--pr)}.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--go);border-radius:8px;transition:width .7s}
.seg{display:flex;background:var(--pa);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:9px;font-weight:600;cursor:pointer}.seg .a{background:var(--pr);color:var(--on)}
.chips{display:flex;gap:8px;margin-bottom:14px}.chip{border:1px solid var(--bd);background:none;color:var(--mu);padding:5px 14px;border-radius:20px;cursor:pointer}.chip.a{border-color:var(--pr);color:var(--pr);font-weight:600}
.rc{position:relative;background:var(--pa);border-radius:14px;padding:14px;margin-bottom:14px;cursor:pointer;box-shadow:0 1px 0 var(--bd)}
.rc h3{margin:0;font-size:1.02rem;padding-inline-end:90px}.rc p{margin:2px 0 0;color:var(--mu);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cut{border-top:2px dashed var(--bd);margin:12px -14px;position:relative}
.cut::before,.cut::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.cut::before{inset-inline-start:-9px}.cut::after{inset-inline-end:-9px}
.ft{display:flex;justify-content:space-between;font-size:.84rem;color:var(--mu)}.ft .u{color:var(--er);font-weight:600}.x{opacity:.6}
.st{position:absolute;inset-inline-end:14px;top:12px;transform:rotate(-7deg);border:2px solid var(--pr);color:var(--pr);padding:1px 9px;border-radius:7px;font-weight:700;font-size:.78rem}
.st.cl{border-color:var(--er);color:var(--er)}
.st.rj{border-color:var(--er);color:var(--er)}
.ov{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;inset-inline:0;bottom:0;max-width:560px;margin:auto;background:var(--pa);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto;z-index:6}.sh.on{transform:none}
.grip{width:40px;height:4px;background:var(--bd);border-radius:4px;margin:0 auto 14px}.sh h2{margin:0 0 4px;font-size:1.2rem}
.dz{display:block;border:2px dashed var(--bd);border-radius:14px;padding:22px;text-align:center;color:var(--mu);cursor:pointer;margin-top:12px}.dz.f{border-color:var(--pr);color:var(--pr);font-weight:600}.dz input{display:none}
textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);margin-top:10px;resize:none}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--pr);color:var(--on);font-weight:700;margin-top:12px;cursor:pointer}.btn:disabled{opacity:.5}
.tl{border-inline-start:2px solid var(--bd);padding-inline-start:16px;margin:10px 6px 0}.tl>div{position:relative;padding-bottom:14px}
.tl>div::before{content:"";position:absolute;inset-inline-start:-23px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--bd)}.tl>div.l::before{background:var(--go)}.tl>div.acc::before{background:var(--ok)}.tl>div.rej::before{background:var(--er)}
.mu{color:var(--mu);font-size:.85rem}.em{text-align:center;color:var(--mu);padding:40px 10px}
.ts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:30px;transform:translateY(-250%);transition:transform .3s;z-index:9}.ts.on{transform:none}
.badge-status{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:20px;border:1px solid}
.badge-status.pending{border-color:var(--go);color:var(--go)}
.badge-status.accepted{border-color:var(--ok);color:var(--ok)}
.badge-status.rejected{border-color:var(--er);color:var(--er)}
.tnote{margin-top:6px;padding:8px 12px;border-radius:10px;font-size:.85rem;border-inline-start:3px solid var(--pr);background:color-mix(in srgb,var(--pr) 8%,transparent)}
.reject-box{margin-top:10px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--er) 10%,transparent);border:1px solid var(--er);font-size:.88rem}
.reject-box b{color:var(--er)}
.file-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--pa);border:1px solid var(--bd);border-radius:10px;font-size:.85rem}
.file-item .ic{flex:none;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff}
.file-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.file-item .sz{color:var(--mu);font-size:.75rem;flex:none}
.file-item .dl{flex:none;background:var(--pr);color:var(--on);border:0;padding:5px 10px;border-radius:7px;font-size:.75rem;cursor:pointer}
.pick-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pick-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:10px;border:1px solid var(--bd);font-size:.85rem}
.pick-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.pick-item .rm{background:none;border:0;color:var(--er);font-size:1.1rem;cursor:pointer;padding:0 6px}
.loading{text-align:center;padding:60px;color:var(--mu)}
.logout{background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:.8rem}
</style></head><body>
<div id="root"><div class="loading">⏳ جاري التحميل...</div></div>
<div class="ov" id="ov"></div><section class="sh" id="sh"></section><div class="ts" id="ts"></div>

<script src="supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
let me=null,myClass=null,tasks=[],mine=[],view='home',flt='all';
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function closeSh(){$('#sh').classList.remove('on');$('#ov').classList.remove('on')}
$('#ov').onclick=closeSh;

const latestByTask=()=>{const m={};mine.forEach(s=>{if(!m[s.task_id]||new Date(s.submitted_at)>new Date(m[s.task_id].submitted_at))m[s.task_id]=s});return m};

function filesHTML(files){
  if(!files||!files.length)return '<div class="mu">بدون ملفات</div>';
  return `<div class="file-list">${files.map(f=>{
    const ic=fileIcon(f.file_type,f.file_name);
    return `<div class="file-item">
      <div class="ic" style="background:${ic.color}">${ic.label}</div>
      <div class="nm">${esc(f.file_name)}</div>
      <div class="sz">${humanSize(f.file_size)}</div>
      <button class="dl" data-path="${esc(f.file_path)}" data-name="${esc(f.file_name)}">تحميل</button>
    </div>`;
  }).join('')}</div>`;
}

async function openTask(id){
  const t=tasks.find(x=>x.id===id),m=mine.filter(s=>s.task_id===id).sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at)),o=isOpen(t);
  const latest=m[0],wasRejected=latest&&latest.status==='rejected';
  $('#sh').innerHTML=`<div class="grip"></div><h2>${esc(t.title)}</h2><p style="margin:4px 0">${esc(t.description)||''}</p>
  <div class="mu">${o?left(t.deadline)+' · ':''}آخر موعد ${fmt(t.deadline)}</div>
  ${wasRejected?`<div class="reject-box">⚠️ <b>تسليمك مرفوض</b>${latest.teacher_note?`<div style="margin-top:4px">ملاحظة: ${esc(latest.teacher_note)}</div>`:''}</div>`:''}
  ${o?`<label class="dz" id="dz"><input type="file" id="fl" multiple><span id="fn">📎 اضغط لاختيار ملفات (متعدد)</span></label>
    <div id="pickList" class="pick-list"></div>
    <textarea id="nt" rows="2" placeholder="ملاحظة للمعلم (اختياري)"></textarea>
    <button class="btn" id="sb">${wasRejected?'إعادة التسليم ↻':m.length?'تحديث':'تسليم الحل'}</button>`
    :'<div class="em" style="padding:20px 0 4px">انتهى وقت التسليم</div>'}
  <h2 style="font-size:1rem;margin-top:18px">سجل تسليماتك</h2>
  <div class="tl">${m.map((s,i)=>{
    const cls=s.status==='accepted'?'acc':s.status==='rejected'?'rej':i?'':'l';
    return `<div class="${cls}"><b>${i?'نسخة سابقة':'آخر تسليم'}</b> <span class="badge-status ${stClass(s.status)}">${stLabel(s.status)}</span>
    <div class="mu">${fmt(s.submitted_at)}</div>${filesHTML(s.submission_files)}
    ${s.note?`<div class="mu">📝 ${esc(s.note)}</div>`:''}
    ${s.teacher_note?`<div class="tnote">📝 ${esc(s.teacher_note)}</div>`:''}</div>`;
  }).join('')||'<span class="mu">ما سلّمت بعد</span>'}</div>`;
  $('#sh').classList.add('on');$('#ov').classList.add('on');
  $('#sh').querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{
    try{const url=await api.getFileUrl(b.dataset.path);const a=document.createElement('a');a.href=url;a.download=b.dataset.name;document.body.appendChild(a);a.click();a.remove()}
    catch(e){toast('خطأ في التحميل')}
  });
  if(!o)return;
  let picked=[];
  const renderPicked=()=>{
    const pl=$('#pickList');if(!pl)return;
    pl.innerHTML=picked.map((f,i)=>{
      const ic=fileIcon(f.type,f.name);
      return `<div class="pick-item"><div class="ic" style="background:${ic.color};width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff">${ic.label}</div>
      <div class="nm">${esc(f.name)}</div><div class="sz" style="font-size:.75rem;color:var(--mu)">${humanSize(f.size)}</div>
      <button class="rm" data-rm="${i}">✕</button></div>`}).join('');
    pl.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.rm,1);renderPicked()});
    $('#fn').textContent=picked.length?`✓ ${picked.length} ملف`:'📎 اضغط لاختيار ملفات (متعدد)';
    $('#dz').classList.toggle('f',picked.length>0);
  };
  $('#fl').onchange=e=>{const files=[...e.target.files];for(const f of files){const err=validateFile(f);if(err){toast(err);continue}if(picked.some(p=>p.name===f.name&&p.size===f.size))continue;picked.push(f)}e.target.value='';renderPicked()};
  $('#sb').onclick=async()=>{
    const n=$('#nt').value.trim();
    if(!picked.length&&!n)return toast('أرفق ملف أو اكتب ملاحظة');
    $('#sb').disabled=true;$('#sb').textContent='جارٍ الرفع...';
    try{
      await api.submitWork({taskId:id,classId:myClass.id,files:picked,note:n});
      closeSh();toast(m.length?'تم التحديث':'تم التسليم');await refresh();
    }catch(e){toast('فشل: '+(e.message||e));$('#sb').disabled=false;$('#sb').textContent='إعادة المحاولة'}
  };
}

async function render(){
  if(!me)return;
  const cls=myClass;
  if(!cls){
    $('#root').innerHTML=`<div class="loading">⚠️ حسابك غير مرتبط بشعبة. تواصل مع المعلم.</div>
    <div style="text-align:center;padding:20px"><button class="btn" id="logout2" style="max-width:200px;margin:auto">خروج</button></div>`;
    $('#logout2').onclick=async()=>{await api.signOut();location.href='auth.html'};
    return;
  }
  const lb=latestByTask(),done=new Set(Object.keys(lb));
  const rejectedCount=Object.values(lb).filter(s=>s.status==='rejected').length;
  const cnt=tasks.filter(t=>done.has(t.id)).length,pc=tasks.length?cnt/tasks.length*100:0;

  let body='';
  if(view==='log'){
    body=mine.length?`<div class="tl">${mine.map(s=>{
      const t=tasks.find(x=>x.id===s.task_id)||{title:'مهمة محذوفة'};
      const cls=s.status==='accepted'?'acc':s.status==='rejected'?'rej':'';
      return `<div class="${cls}"><b>${esc(t.title)}</b> <span class="badge-status ${stClass(s.status)}">${stLabel(s.status)}</span>
      <div class="mu">${fmt(s.submitted_at)}</div>${filesHTML(s.submission_files)}
      ${s.teacher_note?`<div class="tnote">📝 ${esc(s.teacher_note)}</div>`:''}</div>`;
    }).join('')}</div>`:'<div class="em">ما سلّمت بعد</div>';
  } else {
    const L=tasks.filter(t=>flt==='open'?isOpen(t)&&!done.has(t.id):flt==='done'?done.has(t.id):true);
    body=`<div class="chips">${[['all','الكل'],['open','المطلوبة'],['done','المسلَّمة']].map(([k,n])=>`<button class="chip ${flt===k?'a':''}" data-f="${k}">${n}</button>`).join('')}</div>`+
    (L.map(t=>{
      const o=isOpen(t),d=done.has(t.id),latest=lb[t.id];
      const rej=d&&latest&&latest.status==='rejected',soon=isSoon(t)&&!d;
      let badge='';
      if(rej)badge='<span class="st rj">مرفوض - أعد</span>';
      else if(d&&latest.status==='accepted')badge='<span class="st">مقبول ✓</span>';
      else if(d&&latest.status==='pending')badge='<span class="st">بانتظار</span>';
      else if(!o)badge='<span class="st cl">مغلقة</span>';
      else if(soon)badge='<span class="st">تنتهي قريباً</span>';
      return `<div class="rc ${o?'':'x'}" data-id="${t.id}">${badge}
      <h3>${esc(t.title)}</h3><p>${esc(t.description)}</p><div class="cut"></div>
      <div class="ft"><span>${fmt(t.deadline)}</span><span class="${o&&(new Date(t.deadline)-Date.now())<864e5&&!d?'u':''}">${o?left(t.deadline):d?(rej?'أعد التسليم':'تم'):'انتهى'}</span></div></div>`;
    }).join('')||'<div class="em">ما في مهام 🎉</div>');
  }

  $('#root').innerHTML=`<div class="top">
    <div><small>📚 ${esc(cls.name)}</small><h1>${esc(me.full_name)}</h1></div>
    <button class="logout" id="logout">خروج</button>
  </div>
  <main>
    <div class="hero"><span class="n">${cnt}</span> من ${tasks.length} مسلَّمة${rejectedCount?` · <b style="color:var(--er)">${rejectedCount} مرفوض</b>`:''}<div class="bar"><i style="width:${pc}%"></i></div></div>
    <div class="seg"><button data-v="home" class="${view==='home'?'a':''}">المهام</button><button data-v="log" class="${view==='log'?'a':''}">سجل تسليماتي</button></div>
    ${body}
  </main>`;

  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;render()});
  document.querySelectorAll('.rc').forEach(b=>b.onclick=()=>openTask(b.dataset.id));
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{
    try{const url=await api.getFileUrl(b.dataset.path);const a=document.createElement('a');a.href=url;a.download=b.dataset.name;document.body.appendChild(a);a.click();a.remove()}
    catch(e){toast('خطأ في التحميل')}
  });
  $('#logout').onclick=async()=>{await api.signOut();location.href='auth.html'};
}

async function refresh(){
  const [t,ms]=await Promise.all([api.getTasks(),api.getMySubmissions()]);
  tasks=t;mine=ms;
  if(me.class_id){
    const sb=await getSB();
    const {data}=await sb.from('classes').select('*').eq('id',me.class_id).single();
    myClass=data;
  }
  render();
}

(async()=>{
  me=await api.requireAuth('student');
  if(!me)return;
  await refresh();
  setInterval(()=>{if(!$('#sh').classList.contains('on'))refresh()},60000);
})();
</script></body></html>
